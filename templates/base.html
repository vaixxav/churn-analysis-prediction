<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}RetentionIQ{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="bg-glow bg-glow--one"></div>
<div class="bg-glow bg-glow--two"></div>

<header class="topbar">
  <div class="topbar__inner">
    <a href="{{ url_for('home') }}" class="brand">
      <span class="brand__mark"><span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span><span class="bar b4"></span></span>
      <span class="brand__name">Retention<span class="brand__accent">IQ</span></span>
    </a>
    <nav class="nav">
      <a href="{{ url_for('home') }}" class="nav__link {{ 'is-active' if request.endpoint == 'home' }}">Home</a>
      <a href="{{ url_for('predict') }}" class="nav__link {{ 'is-active' if request.endpoint == 'predict' }}">Predict</a>
      <a href="{{ url_for('insights') }}" class="nav__link {{ 'is-active' if request.endpoint == 'insights' }}">Insights</a>
      <a href="{{ url_for('about') }}" class="nav__link {{ 'is-active' if request.endpoint == 'about' }}">About</a>
      <a href="{{ url_for('contact') }}" class="nav__link {{ 'is-active' if request.endpoint == 'contact' }}">Contact</a>
    </nav>
  </div>
</header>

<main class="page">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="footer__inner">
    <span>RetentionIQ &mdash; churn prediction on the IBM Telco dataset</span>
    <span class="footer__muted">Logistic Regression &middot; scikit-learn &middot; Flask</span>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
